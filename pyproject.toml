[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrc-simulation"
version = "0.1.0"
description = "Startup-phase repository for the Unity-first Mars rover simulation project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MRC Simulation Team" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mrc-urdf = "urdf_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["urdf-pipeline"]
include = ["urdf_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests", "urdf-pipeline/tests", "ros2/src/mrc_waypoint_demo/test"]
