[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrc-simulation"
version = "0.1.0"
description = "Startup-phase repository for the Unity-first Mars rover simulation project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MRC Simulation Team" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
